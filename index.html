<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Control — Informe Ejecutivo de Producción</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e8eaed;
            --border-strong: #d1d5db;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #1d4ed8;
            --accent-light: #dbeafe;
            --base: #9ca3af;
            --projected: #1d4ed8;
            --gain: #059669;
            --gain-bg: #ecfdf5;
            --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.02);
            --shadow-md: 0 4px 12px rgba(0,0,0,.05);
            --radius: 10px;
            --radius-lg: 14px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        html, body, #root { height: 100%; width: 100%; }

        .app { min-height: 100vh; }

        /* Banner ejecutivo */
        .exec-banner {
            background: linear-gradient(135deg, #0f2744 0%, #1e3a5f 100%);
            color: #fff;
            padding: 28px 32px 32px;
            border-bottom: 4px solid var(--accent);
        }

        .exec-banner-inner {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
        }

        .exec-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .date-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,.12);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: .01em;
        }

        .date-badge svg { flex-shrink: 0; opacity: .9; }

        .report-tag {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: #93c5fd;
        }

        .exec-banner h1 {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -.03em;
            line-height: 1.15;
            color: #fff;
            margin-bottom: 8px;
        }

        .exec-lead {
            font-size: 16px;
            color: rgba(255,255,255,.75);
            max-width: 560px;
            line-height: 1.5;
        }

        .shell {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 28px 48px;
        }

        /* Resumen destacado para jefe */
        .hero-summary {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: center;
            gap: 24px;
            background: var(--surface);
            border: 2px solid var(--accent);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .hero-summary-label {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .hero-summary-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .hero-summary-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .hero-number-block {
            text-align: right;
            min-width: 200px;
        }

        .hero-number {
            font-size: 52px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -.04em;
            line-height: 1;
        }

        .hero-number-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--gain);
            margin-top: 6px;
        }

        /* Header controls */
        .topbar {
            display: flex;
            align-items: stretch;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        /* Simulator panel */
        .simulator {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 28px;
            min-width: 340px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 420px;
        }

        .sim-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--text);
            margin-bottom: 14px;
        }

        .sim-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .sim-value {
            font-size: 36px;
            font-weight: 800;
            color: var(--accent);
            min-width: 72px;
            letter-spacing: -.03em;
        }

        .slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--surface);
            box-shadow: 0 1px 4px rgba(29,78,216,.35);
            cursor: pointer;
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            border: 2px solid var(--surface);
            cursor: pointer;
        }

        .sim-hint {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--gain);
        }

        /* KPI row */
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .kpi {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 26px;
            box-shadow: var(--shadow);
        }

        .kpi.highlight {
            border: 2px solid var(--accent);
            background: linear-gradient(180deg, #eff6ff 0%, #fff 100%);
        }

        .kpi-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .kpi-value {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -.03em;
            color: var(--text);
            line-height: 1;
        }

        .kpi-value.accent { color: var(--accent); }
        .kpi-value.gain { color: var(--gain); }

        .kpi-delta {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--gain);
            background: var(--gain-bg);
            padding: 5px 12px;
            border-radius: 6px;
        }

        .kpi-sub {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Chart grid */
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 22px 24px 16px;
            box-shadow: var(--shadow);
        }

        .panel.wide { grid-column: 1 / -1; }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }

        .panel-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .legend-inline {
            display: flex;
            gap: 16px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .legend-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 2px;
            margin-right: 5px;
            vertical-align: middle;
        }

        .chart-wrap { width: 100%; }

        /* Table */
        .table-panel { margin-bottom: 0; }

        .table-wrap {
            overflow-x: auto;
            max-height: 420px;
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        thead { position: sticky; top: 0; z-index: 2; }

        th {
            text-align: left;
            padding: 10px 14px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .04em;
            color: var(--text-muted);
            background: var(--bg);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        tbody tr:hover td { background: #f9fafb; }

        .td-name { color: var(--text); font-weight: 500; }

        .td-num {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        .td-projected { color: var(--accent); font-weight: 600; }
        .td-gain { color: var(--gain); font-weight: 600; }

        .mini-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .mini-bar-track {
            flex: 1;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            min-width: 60px;
        }

        .mini-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width .35s ease;
        }

        .mini-bar-pct {
            font-size: 11px;
            color: var(--text-muted);
            min-width: 32px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* Tooltip override feel */
        .recharts-default-tooltip {
            border-radius: 8px !important;
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow-md) !important;
        }

        @media (max-width: 1100px) {
            .kpi-row { grid-template-columns: repeat(2, 1fr); }
            .chart-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 900px) {
            .hero-summary { grid-template-columns: 1fr; text-align: center; }
            .hero-number-block { text-align: center; }
            .exec-banner h1 { font-size: 26px; }
        }

        @media (max-width: 600px) {
            .shell { padding: 20px 16px 32px; }
            .exec-banner { padding: 20px 16px; }
            .kpi-row { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; }
            .simulator { max-width: 100%; }
            .exec-banner h1 { font-size: 22px; }
            .hero-number { font-size: 40px; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div style="padding:48px;text-align:center;color:#6b7280;font-family:Inter,sans-serif">
            Cargando tablero…
        </div>
    </div>

    <script type="text/babel">
        if (typeof React === 'undefined' || typeof Recharts === 'undefined') {
            document.getElementById('root').innerHTML =
                '<div style="padding:48px;font-family:Inter,sans-serif;color:#b91c1c">' +
                '<h2 style="margin-bottom:8px">No se pudieron cargar las librerías</h2>' +
                '<p>Abre esta página con un servidor local o verifica tu conexión a internet.</p></div>';
            throw new Error('Dependencias no cargadas');
        }

        const { useState, useMemo } = React;
        const {
            BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
            ResponsiveContainer, AreaChart, Area, Line, ComposedChart,
            ReferenceLine, Cell
        } = Recharts;

        const baseData = [
            { id: 1, activity: "Aplicar Amtex", baseValue: 115 },
            { id: 2, activity: "Armado Nido", baseValue: 405 },
            { id: 3, activity: "Armado PVC", baseValue: 60 },
            { id: 4, activity: "Armado y Empaque PVC con nid", baseValue: 29 },
            { id: 5, activity: "Colocar cinta doble Faz", baseValue: 172 },
            { id: 6, activity: "Colocar Nido", baseValue: 227 },
            { id: 7, activity: "Colocar UPC", baseValue: 242 },
            { id: 8, activity: "Desmontar Tallos", baseValue: 460 },
            { id: 9, activity: "Empacar Tallo Bulk", baseValue: 100 },
            { id: 10, activity: "Empacar Tallo/Flor Bulk", baseValue: 65 },
            { id: 11, activity: "Empaque Display", baseValue: 17 },
            { id: 12, activity: "Empaque PVC", baseValue: 49 },
            { id: 13, activity: "Pegado", baseValue: 38 },
            { id: 14, activity: "Pegar Cinta Razo a PVC", baseValue: 153 },
            { id: 15, activity: "Reacondicionamiento", baseValue: 190 },
            { id: 16, activity: "Tallos", baseValue: 49 },
            { id: 17, activity: "Vinipelado", baseValue: 44 }
        ];

        const COLORS = { base: '#c4c9d4', projected: '#1d4ed8', gain: '#059669', grid: '#f0f1f3' };

        const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
        const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

        function formatFechaGeneral(date = new Date()) {
            const dia = DIAS[date.getDay()];
            const num = date.getDate();
            const mes = MESES[date.getMonth()];
            const anio = date.getFullYear();
            return `${dia.charAt(0).toUpperCase() + dia.slice(1)}, ${num} de ${mes} de ${anio}`;
        }

        function formatPeriodo(date = new Date()) {
            const mes = MESES[date.getMonth()];
            return `${mes.charAt(0).toUpperCase() + mes.slice(1)} ${date.getFullYear()}`;
        }

        const CustomTooltip = ({ active, payload, label }) => {
            if (!active || !payload?.length) return null;
            return (
                <div style={{
                    background: '#fff', border: '1px solid #e8eaed', borderRadius: 8,
                    padding: '10px 14px', fontSize: 12, boxShadow: '0 4px 12px rgba(0,0,0,.08)'
                }}>
                    <div style={{ fontWeight: 600, marginBottom: 6, color: '#111827' }}>{label}</div>
                    {payload.map((p, i) => (
                        <div key={i} style={{ color: '#6b7280', marginTop: 3 }}>
                            <span style={{ color: p.color, fontWeight: 600 }}>{p.name}: </span>
                            {typeof p.value === 'number' ? p.value.toLocaleString() : p.value}
                        </div>
                    ))}
                </div>
            );
        };

        function Dashboard() {
            const [improvementPercent, setImprovementPercent] = useState(10);
            const [hoveredId, setHoveredId] = useState(null);

            const data = useMemo(() =>
                baseData.map(item => {
                    const improvement = (item.baseValue * improvementPercent) / 100;
                    return {
                        ...item,
                        shortName: item.activity.length > 18
                            ? item.activity.slice(0, 16) + '…'
                            : item.activity,
                        currentValue: Math.round(item.baseValue + improvement),
                        improvement: Math.round(improvement),
                    };
                }), [improvementPercent]);

            const totalBase = useMemo(() => baseData.reduce((s, i) => s + i.baseValue, 0), []);
            const totalCurrent = useMemo(() => data.reduce((s, i) => s + i.currentValue, 0), [data]);
            const totalImprovement = totalCurrent - totalBase;
            const efficiency = ((totalCurrent / totalBase) * 100).toFixed(1);

            const topChart = useMemo(() =>
                [...data].sort((a, b) => b.currentValue - a.currentValue).slice(0, 8),
            [data]);

            const gainChart = useMemo(() =>
                [...data].sort((a, b) => b.improvement - a.improvement).slice(0, 8),
            [data]);

            const projectionCurve = useMemo(() => {
                const steps = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50];
                return steps.map(pct => {
                    const projected = baseData.reduce((s, item) =>
                        s + Math.round(item.baseValue + (item.baseValue * pct) / 100), 0);
                    return { pct: `${pct}%`, total: projected, gain: projected - totalBase };
                });
            }, [totalBase]);

            const sortedTable = useMemo(() =>
                [...data].sort((a, b) => b.currentValue - a.currentValue),
            [data]);

            const maxCurrent = Math.max(...data.map(d => d.currentValue));
            const fechaHoy = formatFechaGeneral();
            const periodo = formatPeriodo();

            return (
                <div className="app">
                    <header className="exec-banner">
                        <div className="exec-banner-inner">
                            <div>
                                <div className="exec-meta">
                                    <div className="date-badge">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                                        </svg>
                                        {fechaHoy}
                                    </div>
                                    <span className="report-tag">Informe ejecutivo</span>
                                </div>
                                <h1>Tablero de Control — Producción</h1>
                                <p className="exec-lead">
                                    Resumen de rendimiento y proyección de mejoras operativas · Periodo {periodo}
                                </p>
                            </div>
                        </div>
                    </header>

                    <div className="shell">
                        <section className="hero-summary">
                            <div>
                                <div className="hero-summary-label">Resultado proyectado</div>
                                <div className="hero-summary-title">Meta de producción con mejora del {improvementPercent}%</div>
                                <div className="hero-summary-desc">
                                    De {totalBase.toLocaleString()} unidades base a {totalCurrent.toLocaleString()} unidades proyectadas
                                </div>
                            </div>
                            <div className="hero-number-block">
                                <div className="hero-number">{totalCurrent.toLocaleString()}</div>
                                <div className="hero-number-label">+{totalImprovement.toLocaleString()} unidades adicionales</div>
                            </div>
                        </section>

                        <header className="topbar">
                            <div className="simulator">
                                <div className="sim-label">Escenario de mejora — ajustar proyección</div>
                                <div className="sim-row">
                                    <div className="sim-value">{improvementPercent}%</div>
                                    <input
                                        type="range"
                                        className="slider"
                                        min="0"
                                        max="50"
                                        step="1"
                                        value={improvementPercent}
                                        onChange={e => setImprovementPercent(+e.target.value)}
                                    />
                                </div>
                                <div className="sim-hint">
                                    Impacto: +{totalImprovement.toLocaleString()} unidades sobre la base
                                </div>
                            </div>
                        </header>

                        <section className="kpi-row">
                            <div className="kpi">
                                <div className="kpi-label">Rendimiento base</div>
                                <div className="kpi-value">{totalBase.toLocaleString()}</div>
                                <div className="kpi-sub">Unidades del periodo</div>
                            </div>
                            <div className="kpi highlight">
                                <div className="kpi-label">Meta proyectada</div>
                                <div className="kpi-value accent">{totalCurrent.toLocaleString()}</div>
                                <div className="kpi-delta">+{totalImprovement.toLocaleString()} un.</div>
                            </div>
                            <div className="kpi">
                                <div className="kpi-label">Incremento</div>
                                <div className="kpi-value gain">+{improvementPercent}%</div>
                                <div className="kpi-sub">{Math.round(totalImprovement / data.length)} un. por actividad</div>
                            </div>
                            <div className="kpi">
                                <div className="kpi-label">Eficiencia</div>
                                <div className="kpi-value">{efficiency}%</div>
                                <div className="kpi-sub">vs. línea base 100%</div>
                            </div>
                        </section>

                        <section className="chart-grid">
                            <div className="panel wide">
                                <div className="panel-head">
                                    <div>
                                        <div className="panel-title">Base vs. Proyectado — Top actividades</div>
                                        <div className="panel-sub">Comparativa interactiva por volumen</div>
                                    </div>
                                    <div className="legend-inline">
                                        <span><span className="legend-dot" style={{ background: COLORS.base }}></span>Base</span>
                                        <span><span className="legend-dot" style={{ background: COLORS.projected }}></span>Proyectado</span>
                                    </div>
                                </div>
                                <div className="chart-wrap" style={{ height: 320 }}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={topChart} barGap={4} barCategoryGap="18%"
                                            margin={{ top: 4, right: 8, left: 0, bottom: 60 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.grid} vertical={false} />
                                            <XAxis
                                                dataKey="shortName"
                                                tick={{ fontSize: 10, fill: '#9ca3af' }}
                                                angle={-35}
                                                textAnchor="end"
                                                interval={0}
                                                height={70}
                                                axisLine={false}
                                                tickLine={false}
                                            />
                                            <YAxis
                                                tick={{ fontSize: 11, fill: '#9ca3af' }}
                                                axisLine={false}
                                                tickLine={false}
                                                width={48}
                                            />
                                            <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(29,78,216,.04)' }} />
                                            <Bar dataKey="baseValue" name="Base" fill={COLORS.base} radius={[3, 3, 0, 0]} />
                                            <Bar dataKey="currentValue" name="Proyectado" fill={COLORS.projected} radius={[3, 3, 0, 0]} />
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="panel">
                                <div className="panel-head">
                                    <div>
                                        <div className="panel-title">Curva de proyección</div>
                                        <div className="panel-sub">Total acumulado según % de mejora</div>
                                    </div>
                                </div>
                                <div className="chart-wrap" style={{ height: 260 }}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={projectionCurve}
                                            margin={{ top: 8, right: 12, left: 0, bottom: 0 }}>
                                            <defs>
                                                <linearGradient id="gradProjected" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="0%" stopColor={COLORS.projected} stopOpacity={0.18} />
                                                    <stop offset="100%" stopColor={COLORS.projected} stopOpacity={0} />
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.grid} vertical={false} />
                                            <XAxis dataKey="pct" tick={{ fontSize: 10, fill: '#9ca3af' }} axisLine={false} tickLine={false} />
                                            <YAxis tick={{ fontSize: 10, fill: '#9ca3af' }} axisLine={false} tickLine={false} width={44}
                                                tickFormatter={v => `${(v / 1000).toFixed(1)}k`} />
                                            <Tooltip content={<CustomTooltip />} />
                                            <ReferenceLine
                                                x={`${improvementPercent}%`}
                                                stroke={COLORS.gain}
                                                strokeDasharray="4 4"
                                                label={{ value: 'Actual', position: 'top', fontSize: 10, fill: COLORS.gain }}
                                            />
                                            <Area type="monotone" dataKey="total" name="Total proyectado"
                                                stroke={COLORS.projected} strokeWidth={2} fill="url(#gradProjected)" />
                                            <Line type="monotone" dataKey="gain" name="Ganancia"
                                                stroke={COLORS.gain} strokeWidth={1.5} dot={false} strokeDasharray="4 2" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            <div className="panel">
                                <div className="panel-head">
                                    <div>
                                        <div className="panel-title">Ganancia por actividad</div>
                                        <div className="panel-sub">Unidades adicionales al {improvementPercent}%</div>
                                    </div>
                                </div>
                                <div className="chart-wrap" style={{ height: 260 }}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <BarChart data={gainChart} layout="vertical"
                                            margin={{ top: 4, right: 16, left: 4, bottom: 4 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke={COLORS.grid} horizontal={false} />
                                            <XAxis type="number" tick={{ fontSize: 10, fill: '#9ca3af' }} axisLine={false} tickLine={false} />
                                            <YAxis type="category" dataKey="shortName"
                                                tick={{ fontSize: 10, fill: '#9ca3af' }} width={100}
                                                axisLine={false} tickLine={false} />
                                            <Tooltip content={<CustomTooltip />} cursor={{ fill: 'rgba(5,150,105,.06)' }} />
                                            <Bar dataKey="improvement" name="Ganancia" radius={[0, 3, 3, 0]}
                                                onMouseEnter={(_, idx) => setHoveredId(gainChart[idx]?.id)}
                                                onMouseLeave={() => setHoveredId(null)}>
                                                {gainChart.map((entry, i) => (
                                                    <Cell key={i}
                                                        fill={hoveredId === entry.id ? COLORS.gain : COLORS.projected}
                                                        fillOpacity={hoveredId && hoveredId !== entry.id ? 0.35 : 1}
                                                    />
                                                ))}
                                            </Bar>
                                        </BarChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>
                        </section>

                        <section className="panel table-panel">
                            <div className="panel-head">
                                <div>
                                    <div className="panel-title">Detalle por actividad</div>
                                    <div className="panel-sub">{data.length} actividades — ordenadas por volumen proyectado</div>
                                </div>
                            </div>
                            <div className="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Actividad</th>
                                            <th>Base</th>
                                            <th>Proyectado</th>
                                            <th>Ganancia</th>
                                            <th>Distribución</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sortedTable.map(item => (
                                            <tr key={item.id}
                                                onMouseEnter={() => setHoveredId(item.id)}
                                                onMouseLeave={() => setHoveredId(null)}
                                                style={{ background: hoveredId === item.id ? '#f9fafb' : undefined }}>
                                                <td className="td-name">{item.activity}</td>
                                                <td className="td-num">{item.baseValue.toLocaleString()}</td>
                                                <td className="td-num td-projected">{item.currentValue.toLocaleString()}</td>
                                                <td className="td-num td-gain">+{item.improvement.toLocaleString()}</td>
                                                <td>
                                                    <div className="mini-bar">
                                                        <div className="mini-bar-track">
                                                            <div className="mini-bar-fill"
                                                                style={{ width: `${(item.currentValue / maxCurrent) * 100}%` }} />
                                                        </div>
                                                        <span className="mini-bar-pct">
                                                            {((item.currentValue / maxCurrent) * 100).toFixed(0)}%
                                                        </span>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            );
        }

        const rootEl = document.getElementById('root');
        if (ReactDOM.createRoot) {
            ReactDOM.createRoot(rootEl).render(<Dashboard />);
        } else {
            ReactDOM.render(<Dashboard />, rootEl);
        }
    </script>
</body>
</html>
